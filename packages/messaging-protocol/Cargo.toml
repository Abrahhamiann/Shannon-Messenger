[package]
name = "shannon-messaging-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
base64 = "=0.23.1"
jni = "=0.21.1"
